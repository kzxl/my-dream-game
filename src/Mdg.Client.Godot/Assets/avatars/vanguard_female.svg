<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlowFem" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a3e6b"/>
      <stop offset="60%" stop-color="#211931"/>
      <stop offset="100%" stop-color="#0e0c19"/>
    </radialGradient>
    <linearGradient id="goldPlateFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="40%" stop-color="#e5c07b"/>
      <stop offset="80%" stop-color="#b58d3d"/>
      <stop offset="100%" stop-color="#6e4f13"/>
    </linearGradient>
    <linearGradient id="steelPlateFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ecf8"/>
      <stop offset="45%" stop-color="#9eb0c7"/>
      <stop offset="80%" stop-color="#5a687d"/>
      <stop offset="100%" stop-color="#313947"/>
    </linearGradient>
    <filter id="glowFem">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="14" fill="url(#bgGlowFem)" />
  <rect x="3" y="3" width="122" height="122" rx="12" fill="none" stroke="url(#goldPlateFem)" stroke-width="2" opacity="0.85" />

  <!-- Flowing Golden Hair Background -->
  <path d="M30 40 C18 65, 22 105, 34 128 L94 128 C106 105, 110 65, 98 40 Z" fill="#d49b35" />

  <!-- Sleek Shoulder Plates -->
  <path d="M16 128 C20 102, 40 92, 54 88 L74 88 C88 92, 108 102, 112 128 Z" fill="url(#steelPlateFem)" />
  <path d="M26 108 L46 96 L50 114 L30 128 Z" fill="url(#goldPlateFem)" />
  <path d="M102 108 L82 96 L78 114 L98 128 Z" fill="url(#goldPlateFem)" />

  <!-- Elegant Gorget -->
  <path d="M48 82 L80 82 L74 96 L54 96 Z" fill="url(#goldPlateFem)" />

  <!-- Female Face Base -->
  <path d="M46 42 C46 30, 82 30, 82 42 C82 64, 76 76, 64 78 C52 76, 46 64, 46 42 Z" fill="#f5caa6" />
  
  <!-- Front Hair Strands & Ponytail Bangs -->
  <path d="M44 38 C54 26, 74 26, 84 38 C76 32, 52 32, 44 38 Z" fill="#f0b64d" />
  <path d="M42 42 C40 60, 46 72, 48 76 C44 68, 42 54, 44 42 Z" fill="#c78924" />
  <path d="M86 42 C88 60, 82 72, 80 76 C84 68, 86 54, 84 42 Z" fill="#c78924" />

  <!-- Bright Confident Eyes & Ruby Lips -->
  <ellipse cx="55" cy="50" rx="4" ry="2.5" fill="#1e1e1e" />
  <circle cx="55" cy="50" r="1.5" fill="#00f2fe" filter="url(#glowFem)" />
  <ellipse cx="73" cy="50" rx="4" ry="2.5" fill="#1e1e1e" />
  <circle cx="73" cy="50" r="1.5" fill="#00f2fe" filter="url(#glowFem)" />
  <path d="M60 66 Q64 70 68 66 Z" fill="#d9534f" />

  <!-- Golden Winged Tiara / Circlet -->
  <path d="M42 38 L64 24 L86 38 L64 32 Z" fill="url(#goldPlateFem)" filter="url(#glowFem)" />
  <polygon points="64,20 68,26 64,30 60,26" fill="#00f2fe" filter="url(#glowFem)" />
</svg>
