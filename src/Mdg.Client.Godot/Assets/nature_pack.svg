    <ellipse cx="64" cy="102" rx="32" ry="9" fill="#080a0f" opacity="0.6"/>
    <!-- Chiseled Boulder Base (Dark Grey Slate) -->
    <polygon points="34,102 24,84 38,58 72,52 98,70 102,96 86,106 48,106" fill="#1e2530"/>
    <polygon points="36,100 26,84 40,60 70,54 96,72 98,94 84,102 50,102" fill="#2d3748"/>
    <!-- Boulder Chiseled Facets -->
    <polygon points="40,60 70,54 78,76 46,84" fill="#4a5568"/>
    <polygon points="70,54 96,72 82,88 78,76" fill="#3b4453"/>
    <polygon points="46,84 78,76 80,98 44,98" fill="#242b35"/>
    <polygon points="42,62 66,56 64,66 44,70" fill="#718096"/>
    <!-- Moss Patches (Deep & Bright Forest Green) -->
    <path d="M38,62 Q48,54 58,58 Q66,54 74,56 L70,68 Q58,62 48,68 Z" fill="#225419"/>
    <path d="M40,60 Q48,56 56,58 L54,64 Q46,62 42,65 Z" fill="#4d9e31"/>
    <circle cx="50" cy="59" r="1.5" fill="#86efac"/>
    <path d="M78,82 Q86,76 94,80 L90,88 Q84,84 80,88 Z" fill="#225419"/>
    <path d="M80,82 Q86,78 92,80 L88,85 Z" fill="#4d9e31"/>
  </g>

  <!-- CELL (3,2): VOID-INFUSED CRYSTAL SPIRE (x: 384, y: 256) -->
  <g id="crystal_spire" transform="translate(384, 256)">
    <ellipse cx="64" cy="106" rx="28" ry="8" fill="#080a0f" opacity="0.6"/>
    <!-- Base Stone Ring -->
    <polygon points="42,106 36,96 50,92 78,92 92,96 86,106" fill="#1e1829"/>
    <!-- Crystal 1 (Left Small) -->
    <polygon points="40,94 34,74 42,62 48,76 46,94" fill="#4c1d95"/>
    <polygon points="42,62 48,76 46,94 42,94" fill="#7c3aed"/>
    <polygon points="38,66 42,62 44,72 40,74" fill="#c4b5fd"/>
    <!-- Crystal 2 (Right Medium) -->
    <polygon points="78,94 74,70 84,54 92,72 86,94" fill="#4c1d95"/>
    <polygon points="84,54 92,72 86,94 82,94" fill="#7c3aed"/>
    <polygon points="80,58 84,54 86,68 82,70" fill="#c4b5fd"/>
    <!-- Crystal 3 (Center Monolith Spire) -->
    <polygon points="56,96 48,60 64,18 78,60 72,96" fill="#2e1065"/>
    <polygon points="64,18 78,60 72,96 64,96" fill="#5b21b6"/>
    <polygon points="64,18 64,96 56,96 48,60" fill="#7c3aed"/>
    <polygon points="64,18 68,48 64,90 60,48" fill="#a855f7"/>
    <polygon points="64,22 66,38 64,56 62,38" fill="#e9d5ff"/>
    <line x1="64" y1="20" x2="64" y2="92" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

</svg>
