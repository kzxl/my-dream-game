  <g id="cherry_tree" transform="translate(256, 0)">
    <ellipse cx="64" cy="116" rx="34" ry="9" fill="#080a0f" opacity="0.6"/>
    <!-- Curved Ancient Trunk -->
    <path d="M58,72 Q52,98 50,116 L76,116 Q72,94 68,72 Z" fill="#382025"/>
    <rect x="58" y="80" width="4" height="34" fill="#57333b"/>
    <!-- Blossom Clusters -->
    <rect x="28" y="24" width="72" height="52" rx="8" fill="#591431"/>
    <rect x="24" y="38" width="80" height="30" rx="8" fill="#591431"/>
    <rect x="30" y="22" width="68" height="48" rx="8" fill="#8c2350"/>
    <rect x="26" y="36" width="76" height="26" rx="8" fill="#8c2350"/>
    <!-- Midtone Pink Highlights -->
    <rect x="34" y="24" width="24" height="20" rx="4" fill="#c4437a"/>
    <rect x="68" y="26" width="22" height="18" rx="4" fill="#c4437a"/>
    <rect x="48" y="16" width="32" height="22" rx="4" fill="#c4437a"/>
    <rect x="28" y="44" width="24" height="14" rx="4" fill="#c4437a"/>
    <rect x="74" y="42" width="24" height="14" rx="4" fill="#c4437a"/>
    <!-- Bright Petal Shimmer -->
    <rect x="38" y="26" width="14" height="10" rx="2" fill="#f472b6"/>
    <rect x="52" y="18" width="18" height="10" rx="2" fill="#f472b6"/>
    <rect x="76" y="28" width="12" height="8" rx="2" fill="#f472b6"/>
    <rect x="54" y="20" width="8" height="4" fill="#fbcfe8"/>
  </g>

  <!-- CELL (3,0): CURSED AUTUMN ASH TREE (Fiery Amber / Blood Orange) -->
  <g id="autumn_tree" transform="translate(384, 0)">
    <ellipse cx="64" cy="116" rx="34" ry="9" fill="#080a0f" opacity="0.6"/>
    <rect x="58" y="74" width="12" height="42" fill="#2d1d17"/>
    <rect x="60" y="76" width="3" height="38" fill="#4d3228"/>
    <!-- Deep Reddish Foliage Shadow -->
    <rect x="28" y="22" width="72" height="54" rx="8" fill="#52120e"/>
    <rect x="22" y="38" width="84" height="32" rx="8" fill="#52120e"/>
    <rect x="30" y="20" width="68" height="50" rx="8" fill="#8f2b18"/>
    <rect x="24" y="36" width="80" height="28" rx="8" fill="#8f2b18"/>
    <!-- Golden Amber Midtone -->
    <rect x="34" y="22" width="26" height="22" rx="4" fill="#d9651e"/>
    <rect x="66" y="24" width="24" height="20" rx="4" fill="#d9651e"/>
    <rect x="46" y="14" width="36" height="24" rx="4" fill="#d9651e"/>
    <!-- Bright Gold Specular -->
    <rect x="38" y="24" width="16" height="12" rx="2" fill="#fbbf24"/>
    <rect x="52" y="16" width="20" height="12" rx="2" fill="#fbbf24"/>
    <rect x="74" y="26" width="14" height="10" rx="2" fill="#fbbf24"/>
    <rect x="54" y="18" width="10" height="5" fill="#fef08a"/>
