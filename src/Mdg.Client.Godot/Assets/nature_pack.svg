<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <defs>
    <!-- Pixel Shading Filters & Gradients -->
    <filter id="pixelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#0a0d14" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ========================================================================= -->
  <!-- ROW 0: TREES (128x128 each)                                               -->
  <!-- ========================================================================= -->

  <!-- CELL (0,0): ANCIENT GNARLED OAK TREE (Dark Fantasy Pixel Art) -->
  <g id="oak_tree" transform="translate(0, 0)">
    <!-- Base Drop Shadow -->
    <ellipse cx="64" cy="116" rx="36" ry="10" fill="#080a0f" opacity="0.6"/>
    <!-- Root Base -->
    <path d="M48,118 L54,108 L60,112 L68,112 L74,108 L80,118 L72,118 L64,115 L56,118 Z" fill="#26170d"/>
    <!-- Gnarled Trunk (Pixel Textured) -->
    <rect x="56" y="70" width="16" height="44" fill="#3d2314"/>
    <rect x="58" y="72" width="4" height="40" fill="#2b180d"/>
    <rect x="64" y="74" width="4" height="36" fill="#54331d"/>
    <rect x="68" y="76" width="3" height="32" fill="#26170d"/>
    <!-- Branch Left & Right -->
    <path d="M56,82 L42,74 L44,70 L58,76 Z" fill="#3d2314"/>
    <path d="M70,80 L84,72 L86,76 L72,84 Z" fill="#3d2314"/>
    <!-- Foliage Layer 1 - Deep Shadow Clusters -->
    <rect x="28" y="32" width="72" height="46" rx="6" fill="#183311"/>
    <rect x="22" y="44" width="84" height="28" rx="6" fill="#183311"/>
    <rect x="36" y="20" width="56" height="50" rx="8" fill="#183311"/>
    <!-- Foliage Layer 2 - Midtone Forest Green -->
    <rect x="30" y="30" width="68" height="44" rx="6" fill="#2b591d"/>
    <rect x="24" y="42" width="80" height="26" rx="6" fill="#2b591d"/>
    <rect x="38" y="18" width="52" height="48" rx="8" fill="#2b591d"/>
    <!-- Foliage Layer 3 - Light Green Clusters (Pixel Highlights) -->
    <rect x="32" y="22" width="24" height="22" rx="4" fill="#44802c"/>
    <rect x="68" y="24" width="22" height="20" rx="4" fill="#44802c"/>
    <rect x="46" y="14" width="36" height="24" rx="4" fill="#44802c"/>
    <rect x="26" y="44" width="26" height="18" rx="4" fill="#44802c"/>
    <rect x="74" y="42" width="26" height="18" rx="4" fill="#44802c"/>
    <!-- Foliage Layer 4 - Specular Bright Highlights -->
    <rect x="36" y="24" width="14" height="10" rx="2" fill="#71b34a"/>
    <rect x="52" y="16" width="22" height="12" rx="2" fill="#71b34a"/>
    <rect x="76" y="26" width="12" height="8" rx="2" fill="#71b34a"/>
    <rect x="30" y="46" width="14" height="8" rx="2" fill="#71b34a"/>
    <rect x="78" y="44" width="14" height="8" rx="2" fill="#71b34a"/>
    <rect x="54" y="18" width="12" height="5" fill="#a4db6e"/>
  </g>

  <!-- CELL (1,0): FROSTPEAK PINE TREE (Tiered Needle Pine) -->
  <g id="pine_tree" transform="translate(128, 0)">
    <ellipse cx="64" cy="116" rx="30" ry="8" fill="#080a0f" opacity="0.6"/>
    <!-- Trunk -->
    <rect x="59" y="88" width="10" height="26" fill="#382115"/>
    <rect x="61" y="90" width="3" height="22" fill="#523220"/>
    <!-- Tier 3 (Bottom Needles) -->
    <polygon points="64,68 18,102 110,102" fill="#132b26"/>
    <polygon points="64,68 22,98 106,98" fill="#1b423b"/>
    <polygon points="64,70 30,94 98,94" fill="#285e54"/>
    <polygon points="64,72 40,88 88,88" fill="#3c8275"/>
    <!-- Tier 2 (Middle Needles) -->
    <polygon points="64,42 26,74 102,74" fill="#132b26"/>
    <polygon points="64,42 30,70 98,70" fill="#1b423b"/>
    <polygon points="64,44 38,66 90,66" fill="#285e54"/>
    <polygon points="64,46 46,60 82,60" fill="#3c8275"/>
    <!-- Tier 1 (Top Peak) -->
    <polygon points="64,14 36,46 92,46" fill="#132b26"/>
    <polygon points="64,14 40,43 88,43" fill="#1b423b"/>
    <polygon points="64,16 46,39 82,39" fill="#285e54"/>
    <polygon points="64,18 52,34 76,34" fill="#3c8275"/>
    <!-- Frost / Snow Highlights -->
    <polygon points="64,14 58,26 70,26" fill="#8bf0e0"/>
    <polygon points="64,42 54,54 74,54" fill="#8bf0e0"/>
    <polygon points="64,68 50,78 78,78" fill="#8bf0e0"/>
  </g>

