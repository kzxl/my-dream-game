    <circle cx="64" cy="80" r="5" fill="#d97706"/>
    <circle cx="64" cy="80" r="2.5" fill="#fde68a"/>
    <circle cx="48" cy="86" r="5.5" fill="#d97706"/>
    <circle cx="48" cy="86" r="2" fill="#fde68a"/>
    <circle cx="78" cy="86" r="5.5" fill="#d97706"/>
    <circle cx="78" cy="86" r="2" fill="#fde68a"/>
  </g>

  <!-- CELL (1,2): LUMINESCENT SPORE MUSHROOM (x: 128, y: 256) -->
  <g id="mushroom_glow" transform="translate(128, 256)">
    <ellipse cx="64" cy="102" rx="26" ry="7" fill="#080a0f" opacity="0.6"/>
    <!-- Stems -->
    <rect x="60" y="80" width="8" height="22" rx="3" fill="#cbd5e1"/>
    <rect x="62" y="82" width="2" height="18" fill="#f8fafc"/>
    <rect x="42" y="88" width="6" height="14" rx="2" fill="#94a3b8"/>
    <rect x="80" y="86" width="6" height="16" rx="2" fill="#94a3b8"/>
    <!-- Big Center Glow Cap (Cyan/Teal Spores) -->
    <path d="M44,80 Q64,52 84,80 Z" fill="#0e454f"/>
    <path d="M46,78 Q64,54 82,78 Z" fill="#06b6d4"/>
    <path d="M50,74 Q64,56 78,74 Z" fill="#67e8f9"/>
    <!-- Glowing Spots -->
    <circle cx="56" cy="68" r="2.5" fill="#ecfeff"/>
    <circle cx="70" cy="66" r="2.5" fill="#ecfeff"/>
    <circle cx="64" cy="60" r="2" fill="#ecfeff"/>
    <!-- Side Small Caps -->
    <path d="M34,88 Q44,70 54,88 Z" fill="#0284c7"/>
    <circle cx="44" cy="78" r="1.5" fill="#e0f2fe"/>
    <path d="M74,86 Q84,68 94,86 Z" fill="#8b5cf6"/>
    <circle cx="84" cy="76" r="1.5" fill="#ede9fe"/>
  </g>

