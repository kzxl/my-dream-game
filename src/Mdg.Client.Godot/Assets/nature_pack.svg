  <!-- ========================================================================= -->
  <!-- ROW 1: BUSHES & FLORA (128x128 each)                                      -->
  <!-- ========================================================================= -->

  <!-- CELL (0,1): WILD BLACKBERRY BUSH (x: 0, y: 128) -->
  <g id="bush" transform="translate(0, 128)">
    <ellipse cx="64" cy="100" rx="28" ry="7" fill="#080a0f" opacity="0.6"/>
    <!-- Bush Clump Shadow -->
    <rect x="32" y="62" width="64" height="36" rx="10" fill="#142e11"/>
    <rect x="24" y="70" width="80" height="26" rx="8" fill="#142e11"/>
    <!-- Midtone Leaves -->
    <rect x="34" y="60" width="60" height="32" rx="8" fill="#25541c"/>
    <rect x="26" y="68" width="76" height="22" rx="6" fill="#25541c"/>
    <!-- Leaf Highlights -->
    <rect x="36" y="62" width="22" height="14" rx="3" fill="#44802c"/>
    <rect x="68" y="64" width="22" height="14" rx="3" fill="#44802c"/>
    <rect x="48" y="56" width="28" height="16" rx="3" fill="#44802c"/>
    <rect x="52" y="58" width="12" height="6" fill="#71b34a"/>
    <!-- Berries (Deep Violet & Crimson) -->
    <circle cx="44" cy="74" r="3" fill="#701a75"/>
    <circle cx="43" cy="73" r="1" fill="#f472b6"/>
    <circle cx="78" cy="72" r="3" fill="#701a75"/>
    <circle cx="62" cy="80" r="3.5" fill="#9f1239"/>
    <circle cx="61" cy="79" r="1" fill="#fb7185"/>
    <circle cx="86" cy="82" r="3" fill="#9f1239"/>
  </g>

  <!-- CELL (1,1): DENSE TALL REED GRASS (x: 128, y: 128) -->
  <g id="tall_grass" transform="translate(128, 128)">
    <ellipse cx="64" cy="102" rx="24" ry="6" fill="#080a0f" opacity="0.5"/>
    <!-- Dark Grass Blades -->
    <path d="M42,102 L38,62 L46,102 Z" fill="#163814"/>
    <path d="M50,102 L48,54 L56,102 Z" fill="#163814"/>
    <path d="M60,102 L62,48 L66,102 Z" fill="#163814"/>
    <path d="M72,102 L76,52 L78,102 Z" fill="#163814"/>
    <path d="M82,102 L88,64 L86,102 Z" fill="#163814"/>
    <!-- Midtone Blades -->
    <path d="M44,102 L42,66 L48,102 Z" fill="#2d6a24"/>
    <path d="M52,102 L52,58 L58,102 Z" fill="#2d6a24"/>
    <path d="M62,102 L64,52 L68,102 Z" fill="#2d6a24"/>
    <path d="M70,102 L74,56 L76,102 Z" fill="#2d6a24"/>
    <path d="M80,102 L84,68 L84,102 Z" fill="#2d6a24"/>
    <!-- Bright Tips -->
    <path d="M52,66 L52,58 L55,66 Z" fill="#65a30d"/>
    <path d="M62,60 L64,52 L65,60 Z" fill="#84cc16"/>
    <path d="M71,64 L74,56 L75,64 Z" fill="#84cc16"/>
  </g>

  <!-- CELL (2,1): BLOOD LOTUS WILDFLOWERS (x: 256, y: 128) -->
  <g id="flowers_red" transform="translate(256, 128)">
    <ellipse cx="64" cy="100" rx="22" ry="6" fill="#080a0f" opacity="0.5"/>
    <!-- Leaf base -->
    <ellipse cx="64" cy="98" rx="20" ry="8" fill="#1c4718"/>
    <ellipse cx="64" cy="96" rx="16" ry="6" fill="#307828"/>
    <!-- Red Flowers -->
    <!-- Center Big Flower -->
    <circle cx="64" cy="80" r="7" fill="#881337"/>
    <circle cx="64" cy="80" r="5" fill="#e11d48"/>
    <circle cx="64" cy="80" r="2.5" fill="#fbbf24"/>
    <!-- Left Flower -->
    <circle cx="48" cy="88" r="5.5" fill="#881337"/>
    <circle cx="48" cy="88" r="4" fill="#e11d48"/>
    <circle cx="48" cy="88" r="2" fill="#fbbf24"/>
    <!-- Right Flower -->
    <circle cx="78" cy="86" r="6" fill="#881337"/>
    <circle cx="78" cy="86" r="4.5" fill="#e11d48"/>
    <circle cx="78" cy="86" r="2" fill="#fbbf24"/>
    <!-- Top Small Bud -->
    <circle cx="58" cy="70" r="4" fill="#e11d48"/>
    <circle cx="58" cy="70" r="1.5" fill="#ffe4e6"/>
  </g>

  <!-- CELL (3,1): STARLIGHT AZURE FLOWERS (x: 384, y: 128) -->
  <g id="flowers_blue" transform="translate(384, 128)">
    <ellipse cx="64" cy="100" rx="22" ry="6" fill="#080a0f" opacity="0.5"/>
    <ellipse cx="64" cy="98" rx="20" ry="8" fill="#12382c"/>
    <ellipse cx="64" cy="96" rx="16" ry="6" fill="#1e5c49"/>
