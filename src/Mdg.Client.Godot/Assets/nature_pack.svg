    <circle cx="64" cy="78" r="7.5" fill="#0f375a"/>
    <circle cx="64" cy="78" r="5.5" fill="#0284c7"/>
    <circle cx="64" cy="78" r="3" fill="#38bdf8"/>
    <circle cx="64" cy="78" r="1" fill="#ffffff"/>
    <!-- Side Flowers -->
    <circle cx="46" cy="86" r="6" fill="#0284c7"/>
    <circle cx="46" cy="86" r="3" fill="#7dd3fc"/>
    <circle cx="80" cy="84" r="6" fill="#0284c7"/>
    <circle cx="80" cy="84" r="3" fill="#7dd3fc"/>
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 2: PROPS & ENVIRONMENT (128x128 each)                                 -->
  <!-- ========================================================================= -->

  <!-- CELL (0,2): GOLDEN SUNBURST BLOSSOM (x: 0, y: 256) -->
  <g id="flowers_gold" transform="translate(0, 256)">
    <ellipse cx="64" cy="100" rx="22" ry="6" fill="#080a0f" opacity="0.5"/>
    <ellipse cx="64" cy="98" rx="18" ry="7" fill="#1a3b1a"/>
    <ellipse cx="64" cy="96" rx="14" ry="5" fill="#2d612c"/>
    <!-- Gold/Amber Flowers -->
