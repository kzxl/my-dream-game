<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="noviceBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d493a"/>
      <stop offset="60%" stop-color="#1c241a"/>
      <stop offset="100%" stop-color="#0a0f09"/>
    </radialGradient>
    <linearGradient id="leatherVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5b38"/>
      <stop offset="50%" stop-color="#5c381e"/>
      <stop offset="100%" stop-color="#3b200e"/>
    </linearGradient>
    <filter id="noviceGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="14" fill="url(#noviceBg)" />
  <rect x="3" y="3" width="122" height="122" rx="12" fill="none" stroke="#68805a" stroke-width="2" opacity="0.75" />

  <!-- Leather Tunic & Traveler Cloak -->
  <path d="M12 128 C16 98, 38 88, 54 86 L74 86 C90 88, 112 98, 116 128 Z" fill="url(#leatherVest)" />
  <path d="M36 86 L64 128 L92 86 Z" fill="#2e422d" opacity="0.9" />

  <!-- Face Base -->
  <path d="M46 42 C46 28, 82 28, 82 42 C82 64, 76 76, 64 78 C52 76, 46 64, 46 42 Z" fill="#f4caa1" />

  <!-- Adventurer Spiky Hair & Bandana -->
  <path d="M38 34 C44 14, 84 14, 90 34 C82 26, 46 26, 38 34 Z" fill="#4a3319" />
  <path d="M36 38 C42 22, 60 22, 64 36 Z" fill="#634524" />
  <path d="M64 36 C68 20, 88 22, 92 38 Z" fill="#634524" />
  
  <!-- Red Adventurer Headband -->
  <path d="M42 38 L86 38 L84 46 L44 46 Z" fill="#c0392b" stroke="#962d22" stroke-width="1" />
  <circle cx="64" cy="42" r="2" fill="#f1c40f" filter="url(#noviceGlow)" />

  <!-- Determined Young Eyes -->
  <ellipse cx="55" cy="52" rx="4" ry="3" fill="#1e1e1e" />
  <circle cx="55" cy="52" r="1.5" fill="#f39c12" />
  <circle cx="56" cy="51" r="0.6" fill="#fff" />

  <ellipse cx="73" cy="52" rx="4" ry="3" fill="#1e1e1e" />
  <circle cx="73" cy="52" r="1.5" fill="#f39c12" />
  <circle cx="74" cy="51" r="0.6" fill="#fff" />

  <path d="M60 67 Q64 70 68 67" stroke="#8c4b28" stroke-width="1.5" fill="none" />
</svg>
