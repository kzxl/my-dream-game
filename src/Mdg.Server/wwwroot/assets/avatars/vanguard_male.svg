<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a4d6b"/>
      <stop offset="60%" stop-color="#192231"/>
      <stop offset="100%" stop-color="#0c1119"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#543707"/>
    </linearGradient>
    <linearGradient id="steelPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0d7e5"/>
      <stop offset="45%" stop-color="#8a99ad"/>
      <stop offset="80%" stop-color="#4e5c70"/>
      <stop offset="100%" stop-color="#2c3542"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="14" fill="url(#bgGlow)" />
  <rect x="3" y="3" width="122" height="122" rx="12" fill="none" stroke="url(#goldPlate)" stroke-width="2" opacity="0.85" />

  <!-- Shoulder Armor Plates -->
  <path d="M12 128 C16 98, 38 88, 54 84 L74 84 C90 88, 112 98, 116 128 Z" fill="url(#steelPlate)" />
  <path d="M22 106 L44 94 L50 110 L28 128 Z" fill="url(#goldPlate)" opacity="0.9" />
  <path d="M106 106 L84 94 L78 110 L100 128 Z" fill="url(#goldPlate)" opacity="0.9" />

  <!-- Neck Gorget -->
  <path d="M46 80 L82 80 L76 96 L52 96 Z" fill="url(#goldPlate)" />

  <!-- Knight Head & Helmet Base -->
  <path d="M38 46 C38 24, 90 24, 90 46 C90 68, 84 82, 64 84 C44 82, 38 68, 38 46 Z" fill="url(#steelPlate)" />
  
  <!-- Face Opening / Skin & Beard -->
  <path d="M48 44 C48 36, 80 36, 80 44 C80 62, 74 72, 64 74 C54 72, 48 62, 48 44 Z" fill="#d9a579" />
  <!-- Warrior Hair & Strong Jaw Beard -->
  <path d="M46 38 C52 30, 76 30, 82 38 C78 35, 50 35, 46 38 Z" fill="#3a2312" />
  <path d="M52 64 C56 72, 72 72, 76 64 C76 72, 70 76, 64 76 C58 76, 52 72, 52 64 Z" fill="#2d1b0d" />
  
  <!-- Fierce Eyes -->
  <ellipse cx="56" cy="48" rx="4" ry="2" fill="#000" />
  <circle cx="56" cy="48" r="1.5" fill="#00f2fe" filter="url(#glow)" />
  <ellipse cx="72" cy="48" rx="4" ry="2" fill="#000" />
  <circle cx="72" cy="48" r="1.5" fill="#00f2fe" filter="url(#glow)" />

  <!-- Helmet Wings & Crown Crest -->
  <path d="M64 12 L70 28 L64 36 L58 28 Z" fill="url(#goldPlate)" filter="url(#glow)" />
  <path d="M34 32 C30 18, 44 20, 52 28 C42 26, 36 28, 34 32 Z" fill="url(#goldPlate)" />
  <path d="M94 32 C98 18, 84 20, 76 28 C86 26, 92 28, 94 32 Z" fill="url(#goldPlate)" />

  <!-- Battle Scars & Highlights -->
  <line x1="53" y1="42" x2="59" y2="54" stroke="#8b2500" stroke-width="1.2" opacity="0.75" />
</svg>
